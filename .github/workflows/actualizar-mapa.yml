name: Actualizar mapa

on:
  schedule:
    - cron: "17 6 * * *"        # todos los días, 06:17 UTC (respaldo)
  workflow_dispatch:             # botón manual "Run workflow"
    inputs:
      revisar:
        description: "Revisar si hay pines lejos de su ciudad (tarda unos minutos más)"
        type: boolean
        default: false
  repository_dispatch:
    types: [airtable]            # aviso desde la automatización de Airtable

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-mapa
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Leer Airtable y armar los datos
        run: node robot/actualizar.mjs
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          REVISAR: ${{ inputs.revisar && '1' || '0' }}

      - name: Registrar la ejecución (evita que GitHub pause el robot)
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > ultima-ejecucion.txt
          git config user.name "robot-mapa"
          git config user.email "robot-mapa@users.noreply.github.com"
          git add ultima-ejecucion.txt
          git commit -m "Robot: ejecución $(date -u +%F)" || echo "Sin cambios"
          git push || echo "No se pudo registrar la ejecución"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
          name: github-pages-${{ github.run_attempt }}

      - name: Publicar el mapa
        id: publicar
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
